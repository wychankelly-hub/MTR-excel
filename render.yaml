# Render Blueprint（全免費）：在 Render 網站按「New → Blueprint」選擇此 GitHub repo。
#   網頁服務：Render Free（HTTPS 網址，例如 https://taiyau-station.onrender.com）
#   資料庫：Neon Free PostgreSQL（比賽、成績、隊伍、上載的錄音及角色圖片），把連線字串填入 DATABASE_URL
# 老師電腦關掉後伺服器及資料都會繼續存在。詳見 docs/DEPLOY_CLOUD.md。
services:
  - type: web
    name: taiyau-station
    runtime: node
    plan: free               # 免費：閒置 15 分鐘會休眠；以 cron-job.org 每 10 分鐘開啟 /healthz 保持 24 小時喚醒（DEPLOY_CLOUD.md 步驟 5）
    region: singapore        # 最接近香港的 Render 地區
    numInstances: 1          # 遊戲狀態及即時推送設計為單一實例
    buildCommand: npm ci --omit=optional
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL      # 貼上 Neon 的 Connection string（postgresql://…neon.tech/neondb?sslmode=require…）
        sync: false
      - key: SESSION_SECRET
        generateValue: true  # Render 自動產生長隨機字串
      - key: ALLOW_DEMO_LOGIN
        value: "true"
      - key: DEMO_TEACHER_PIN  # 老師登入碼：部署時在 Render 網頁輸入（請用至少 8 位、不易猜的數字／字母）
        sync: false
      - key: GOOGLE_CLIENT_ID  # （可選）Google 登入
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TEACHER_EMAILS
        sync: false
      - key: ALLOWED_EMAIL_DOMAINS
        sync: false

